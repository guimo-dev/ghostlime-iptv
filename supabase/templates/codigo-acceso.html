<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tu código de acceso</title>
</head>
<body style="margin:0;padding:0;background-color:#14151F;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#14151F;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <img src="https://github.com/guimo-dev/ghostlime-iptv/raw/main/branding/ghostlime-192.png" width="72" height="72" alt="Ghostlime" style="display:block;border:0;">
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#FFFFFF;padding-bottom:12px;">
            Tu código de acceso
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#D5D7E3;padding-bottom:24px;">
            Escribe este código en Ghostlime IPTV. Sirve para recuperar el PIN del control parental o para confirmar el borrado de tu cuenta.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border:2px solid #C6F432;border-radius:12px;">
              <tr>
                <td align="center" style="padding:16px 28px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:8px;color:#C6F432;">
                  {{ .Token }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#A3A6B8;">
            Si no has sido tú, ignora este correo.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
